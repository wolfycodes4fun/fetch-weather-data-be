---
name: 🐋 Build & Deploy to Docker Hub

on:
  pull_request:
    branches: [master]
  
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.14
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint pytest pytest-mock 
      
      - name: Lint with pylint
        continue-on-error: true
        run: |
          pylint src
      
      - name: Run tests with pytest
        env:
          OPEN_WEATHER_MAP_API_KEY: ${{ secrets.OPEN_WEATHER_MAP_API_KEY }}
        run: |
          python -m pytest
  
  build-and-publish-image:
    needs: lint-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.WOLFYCODES4FUN_DOCKERHUB_CREDENTAILS }}
      
      - name: Build Docker image
        run: |
          docker build -t $GITHUB_REPOSITORY_OWNER/weather-data-be:${{ vars.IMAGE_VERSION }} .
      
      - name: Push image to Docker Hub
        run: |
          docker push $GITHUB_REPOSITORY_OWNER/weather-data-be:${{ vars.IMAGE_VERSION }}
      
      - name: Update image version to latest
        run: |
          UPDATED_IMAGE_VERSION=$(( ${{ vars.IMAGE_VERSION }} + 1 ))
          curl -L \
          -X PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GH_COMMON_VARIABLES_TOKEN }}" \
          -H "X-Github-Api-Version: 2026-03-10" \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/IMAGE_VERSION" \
          -d '{"name": "IMAGE_VERSION", "value": "'"$UPDATED_IMAGE_VERSION"'"}'
